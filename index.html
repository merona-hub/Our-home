<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#455B48">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Our Home">
  <title>Our Home</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192-v2.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="loader" role="status" aria-label="Loading">
      <svg viewBox="0 0 48 64" width="46" height="62" aria-hidden="true">
        <g class="glass">
          <path d="M8 4h32M8 60h32" stroke="#455B48" stroke-width="4" stroke-linecap="round"/>
          <path d="M12 6c0 14 12 18 12 26S12 44 12 58h24c0-14-12-18-12-26S36 20 36 6Z" fill="none" stroke="#455B48" stroke-width="3" stroke-linejoin="round"/>
          <path class="sand-top" d="M15 11h18c-1 7-6 11-9 14-3-3-8-7-9-14Z" fill="#B97970"/>
          <path class="sand-bottom" d="M15 55h18c-2-5-5-8-9-9-4 1-7 4-9 9Z" fill="#B97970"/>
          <path class="sand-drop" d="M24 30v16" stroke="#B97970" stroke-width="2" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>
  <div id="sheet-backdrop" class="hidden"></div>
  <div id="sheet" class="hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="hidden"></div>
  <div id="viewer" class="hidden"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
